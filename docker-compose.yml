services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: leovmika68
      MYSQL_DATABASE: identity_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pleovmika68"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  discovery-server:
    build:
      context: .
      target: discovery-server
    container_name: discovery-server
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8761:8761"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  identity-service:
    build:
      context: .
      target: identity-service
    container_name: identity-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8081:8081"
      - "9090:9090"
    env_file:
      - ./identity-service/.env
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      target: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    env_file:
      - ./api-gateway/.env
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      identity-service:
        condition: service_started

  post-service:
    build:
      context: .
      target: post-service
    container_name: post-service
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8082:8082"
    env_file:
      - ./post-service/.env
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Networking & Volumes
# ---------------------------------------------------------------------------
networks:
  backend:
    driver: bridge

volumes:
  mysql_data: